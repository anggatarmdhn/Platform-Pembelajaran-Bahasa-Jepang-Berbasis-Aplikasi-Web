<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ramenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="comicShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Comic Panel Frame -->
  <rect x="8" y="8" width="584" height="304" rx="16" fill="url(#ramenBg)" stroke="#D9383A" stroke-width="3"/>

  <!-- Top Comic Banner / Title -->
  <rect x="24" y="20" width="170" height="28" rx="8" fill="#D9383A"/>
  <text x="34" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="0.5">KOMIK SITUASI #1</text>
  <text x="206" y="39" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="13" fill="#78350F">Kedai Ramen Tradisional Tokyo</text>

  <!-- Wooden Wall & Menu Plaques -->
  <rect x="24" y="60" width="552" height="60" rx="8" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Plaque 1 (Ramen) -->
  <rect x="44" y="68" width="60" height="44" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" filter="url(#comicShadow)"/>
  <text x="50" y="96" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" fill="#DC2626">ラーメン</text>
  <text x="54" y="106" font-family="sans-serif" font-size="8" font-weight="700" fill="#78350F">KATAKANA</text>

  <!-- Plaque 2 (Gyoza) -->
  <rect x="114" y="68" width="60" height="44" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" filter="url(#comicShadow)"/>
  <text x="120" y="96" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" fill="#D97706">ギョーザ</text>
  <text x="124" y="106" font-family="sans-serif" font-size="8" font-weight="700" fill="#78350F">KATAKANA</text>

  <!-- Plaque 3 (Ocha) -->
  <rect x="184" y="68" width="60" height="44" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" filter="url(#comicShadow)"/>
  <text x="194" y="96" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" fill="#059669">お茶</text>
  <text x="192" y="106" font-family="sans-serif" font-size="8" font-weight="700" fill="#78350F">KANJI+HIRA</text>

  <!-- Chef (Left Side) -->
  <g transform="translate(60, 110)">
    <!-- Chef Body -->
    <path d="M40 90 C40 60 70 50 90 50 C110 50 140 60 140 90 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <path d="M65 52 L65 90 M115 52 L115 90" stroke="#DC2626" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="90" cy="30" rx="20" ry="22" fill="#FDE68A" stroke="#334155" stroke-width="2"/>
    <!-- Bandana -->
    <path d="M68 20 C72 12 85 10 90 10 C95 10 108 12 112 20 Z" fill="#DC2626" stroke="#334155" stroke-width="2"/>
    <rect x="67" y="18" width="46" height="8" rx="2" fill="#DC2626"/>
    <!-- Eyes Smiling -->
    <path d="M78 28 Q83 24 88 28" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M92 28 Q97 24 102 28" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M85 36 Q90 42 95 36" stroke="#B45309" stroke-width="2" fill="none"/>
  </g>

  <!-- Steaming Ramen Bowl on Counter (Center) -->
  <g transform="translate(240, 150)">
    <!-- Steam Clouds -->
    <path d="M50 15 Q45 0 55 -15 Q65 -30 55 -40" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M70 20 Q75 5 65 -10 Q55 -25 70 -38" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M90 15 Q85 0 95 -15 Q105 -30 95 -40" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Bowl Outer -->
    <path d="M20 40 Q20 95 70 95 Q120 95 120 40 Z" fill="url(#bowlGrad)" stroke="#1E293B" stroke-width="2.5"/>
    <ellipse cx="70" cy="40" rx="50" ry="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="70" cy="40" rx="44" ry="9" fill="#F59E0B"/>
    <!-- Ramen Toppings (Egg, Nori, Chashu) -->
    <ellipse cx="50" cy="38" rx="8" ry="6" fill="#FFFFFF"/>
    <circle cx="50" cy="38" r="4" fill="#F59E0B"/>
    <rect x="80" y="26" width="12" height="18" rx="2" fill="#1E293B" transform="rotate(15 80 26)"/>
    <ellipse cx="68" cy="42" rx="10" ry="6" fill="#B45309"/>
    <!-- Chopsticks -->
    <line x1="20" y1="20" x2="110" y2="45" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="15" x2="108" y2="41" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Kenji (Right Side, Delighted) -->
  <g transform="translate(390, 110)">
    <!-- Shoulders -->
    <path d="M50 90 C50 65 75 55 95 55 C115 55 140 65 140 90 Z" fill="#2563EB" stroke="#1E293B" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="95" cy="32" rx="19" ry="22" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <!-- Hair -->
    <path d="M76 28 C74 12 85 4 95 4 C106 4 116 12 114 28 C110 24 104 22 98 24 C92 18 84 20 80 26 Z" fill="#1E293B"/>
    <!-- Eyes sparkling -->
    <ellipse cx="88" cy="30" rx="3" ry="4" fill="#1E293B"/>
    <ellipse cx="102" cy="30" rx="3" ry="4" fill="#1E293B"/>
    <circle cx="87" cy="29" r="1.2" fill="#FFFFFF"/>
    <circle cx="101" cy="29" r="1.2" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M90 38 Q95 44 100 38 Z" fill="#D9383A"/>
    <!-- Blush -->
    <ellipse cx="82" cy="36" rx="3" ry="2" fill="#FCA5A5"/>
    <ellipse cx="108" cy="36" rx="3" ry="2" fill="#FCA5A5"/>
  </g>

  <!-- Speech Bubble (Kenji) -->
  <g transform="translate(350, 45)" filter="url(#comicShadow)">
    <path d="M10 0 L190 0 C200 0 205 5 205 15 L205 45 C205 55 200 60 190 60 L60 60 L40 75 L48 60 L10 60 C0 60 -5 55 -5 45 L-5 15 C-5 5 0 0 10 0 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="15" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#1E293B">"Wah! Tulisan menunya</text>
    <text x="15" y="46" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#D9383A">『ラーメン』pakai Katakana!"</text>
  </g>

  <!-- Counter Table Base -->
  <rect x="24" y="240" width="552" height="50" rx="8" fill="#78350F" stroke="#451A03" stroke-width="2"/>
  <rect x="30" y="244" width="540" height="10" fill="#92400E"/>
</svg>
