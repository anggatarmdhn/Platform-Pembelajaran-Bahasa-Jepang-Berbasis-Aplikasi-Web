<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aisatsuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadowAisatsu" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Panel Frame -->
  <rect x="8" y="8" width="584" height="304" rx="16" fill="url(#aisatsuBg)" stroke="#2563EB" stroke-width="3"/>

  <!-- Comic Badge -->
  <rect x="24" y="20" width="170" height="28" rx="8" fill="#2563EB"/>
  <text x="34" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="0.5">KOMIK SITUASI #2</text>
  <text x="206" y="39" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="13" fill="#1E3A8A">Kelas Pagi: Salam &amp; Adab Membungkuk (礼 - Rei)</text>

  <!-- Classroom Blackboard in Background -->
  <rect x="24" y="58" width="552" height="110" rx="8" fill="#064E3B" stroke="#047857" stroke-width="2"/>
  <!-- Blackboard Chalk Writing -->
  <text x="44" y="90" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="18" fill="#A7F3D0">10月27日 (火) おはよう！</text>
  <text x="44" y="120" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#E2E8F0">今日の目標: 挨拶（あいさつ）を正しく覚えよう</text>
  <line x1="44" y1="130" x2="380" y2="130" stroke="#34D399" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Teacher (Sensei Tanaka) standing at Podium (Right) -->
  <g transform="translate(430, 80)">
    <!-- Teacher Suit -->
    <path d="M40 90 C40 60 65 50 85 50 C105 50 130 60 130 90 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <path d="M75 52 L85 68 L95 52 Z" fill="#FFFFFF"/>
    <path d="M83 54 L85 75 L87 54 Z" fill="#D9383A"/>
    <!-- Head -->
    <ellipse cx="85" cy="30" rx="18" ry="20" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <path d="M68 28 C68 12 76 8 85 8 C94 8 102 12 102 28 C98 22 92 20 86 22 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="74" y="24" width="10" height="8" rx="2" fill="none" stroke="#D9383A" stroke-width="1.8"/>
    <rect x="86" y="24" width="10" height="8" rx="2" fill="none" stroke="#D9383A" stroke-width="1.8"/>
    <line x1="84" y1="28" x2="86" y2="28" stroke="#D9383A" stroke-width="1.8"/>
    <path d="M80 38 Q85 43 90 38" stroke="#B45309" stroke-width="2" fill="none"/>
    <!-- Podium -->
    <rect x="25" y="105" width="120" height="95" rx="6" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <rect x="35" y="115" width="100" height="40" rx="4" fill="#92400E"/>
    <!-- Books on Podium -->
    <rect x="50" y="98" width="40" height="7" rx="1.5" fill="#2563EB"/>
    <rect x="46" y="92" width="44" height="6" rx="1.5" fill="#D9383A"/>
  </g>

  <!-- Students (Anggata & Aoi) Bowing Politely (Left) -->
  <!-- Anggata Bowing -->
  <g transform="translate(60, 140)">
    <!-- Slanted body (Bowing 15 degrees) -->
    <path d="M50 70 C30 50 40 25 70 20 C90 18 100 35 110 70 Z" fill="#2563EB" stroke="#1E293B" stroke-width="2" transform="rotate(-15 70 40)"/>
    <!-- Head bowing down -->
    <ellipse cx="45" cy="30" rx="18" ry="20" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <path d="M30 25 C30 10 40 4 52 4 C60 4 64 12 62 25 C58 20 50 18 40 20 Z" fill="#1E293B"/>
    <!-- Eyes closed in respectful greeting -->
    <path d="M38 28 Q43 32 48 28" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M40 38 Q46 42 52 38" stroke="#D9383A" stroke-width="2" fill="none"/>
  </g>

  <!-- Aoi Bowing -->
  <g transform="translate(180, 145)">
    <path d="M50 70 C30 50 40 25 70 20 C90 18 100 35 110 70 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2" transform="rotate(-15 70 40)"/>
    <ellipse cx="45" cy="30" rx="17" ry="19" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <path d="M30 25 C30 10 40 4 52 4 C60 4 64 12 62 25 Z" fill="#92400E"/>
    <!-- Sakura Hair Clip -->
    <circle cx="58" cy="18" r="4" fill="#F472B6"/>
    <path d="M38 28 Q43 32 48 28" stroke="#78350F" stroke-width="2" fill="none"/>
    <path d="M40 38 Q46 42 52 38" stroke="#BE123C" stroke-width="2" fill="none"/>
  </g>

  <!-- Giant Comic Speech Bubble -->
  <g transform="translate(90, 70)" filter="url(#shadowAisatsu)">
    <path d="M10 0 L280 0 C290 0 295 5 295 15 L295 55 C295 65 290 70 280 70 L90 70 L70 85 L78 70 L10 70 C0 70 -5 65 -5 55 L-5 15 C-5 5 0 0 10 0 Z" fill="#FFFFFF" stroke="#D9383A" stroke-width="2.5"/>
    <text x="18" y="30" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="18" fill="#D9383A">「おはようございます！」</text>
    <text x="18" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1E293B">(Ohayō gozaimasu! - Selamat Pagi!)</text>
  </g>

  <!-- Classroom Floor -->
  <rect x="24" y="270" width="552" height="24" rx="4" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>
</svg>
