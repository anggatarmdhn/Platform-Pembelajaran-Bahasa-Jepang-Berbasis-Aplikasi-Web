<svg viewBox="0 0 600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Sky & City Street in Tokyo -->
  <rect width="600" height="320" fill="#F0F9FF"/>
  <!-- Distant City Silhouette -->
  <polygon points="0,210 40,160 80,210 120,140 180,210 240,170 300,210 360,150 420,210 480,180 540,210 600,160 600,220 0,220" fill="#E0F2FE"/>
  <!-- Street & Pavement -->
  <rect y="220" width="600" height="100" fill="#E2E8F0"/>
  <rect y="220" width="600" height="12" fill="#94A3B8"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="24 16"/>

  <!-- Station Sign Post -->
  <rect x="70" y="80" width="10" height="150" fill="#475569"/>
  <rect x="35" y="60" width="80" height="42" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
  <text x="75" y="80" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">駅 STATION</text>
  <text x="75" y="94" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="10" fill="#BAE6FD" text-anchor="middle">50m ➔</text>
  <circle cx="75" cy="50" r="14" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="75" y="55" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">🚉</text>

  <!-- Kenji (Tourist with Backpack & Map) -->
  <g transform="translate(190, 110)">
    <!-- Backpack -->
    <rect x="-14" y="45" width="18" height="40" rx="8" fill="#F97316"/>
    <!-- Body -->
    <rect x="0" y="38" width="42" height="65" rx="12" fill="#2563EB"/>
    <!-- Head -->
    <circle cx="21" cy="20" r="18" fill="#FDE68A"/>
    <!-- Hair -->
    <path d="M4 18 Q21 -4 38 18 Q21 8 4 18 Z" fill="#1E293B"/>
    <!-- Eyes -->
    <circle cx="16" cy="20" r="2.5" fill="#1E293B"/>
    <circle cx="27" cy="20" r="2.5" fill="#1E293B"/>
    <path d="M18 26 Q21 29 25 26" stroke="#78350F" stroke-width="2" fill="none"/>
    <!-- Guidebook/Map in Hand -->
    <rect x="26" y="50" width="28" height="34" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" transform="rotate(12 26 50)"/>
    <text x="38" y="70" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="900" fill="#854D0E" transform="rotate(12 26 50)">MAP</text>
    <!-- Legs -->
    <rect x="6" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
    <rect x="24" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
  </g>

  <!-- Speech Bubble Kenji -->
  <g transform="translate(130, 20)">
    <rect width="210" height="52" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <polygon points="105,52 115,64 125,52" fill="#FFFFFF"/>
    <polygon points="103,52 115,66 127,52" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="104" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="105" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle">すみません、駅はどこですか？</text>
    <text x="105" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748B" text-anchor="middle">Sumimasen, eki wa doko desu ka?</text>
  </g>

  <!-- Passerby (Friendly Japanese Pedestrian) -->
  <g transform="translate(380, 110)">
    <!-- Body -->
    <rect x="0" y="38" width="40" height="65" rx="12" fill="#059669"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="18" fill="#FDE68A"/>
    <!-- Hair -->
    <path d="M3 18 Q20 -6 37 18 Q20 6 3 18 Z" fill="#475569"/>
    <!-- Eyes (Smiling) -->
    <path d="M12 18 Q16 14 20 18" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M24 18 Q28 14 32 18" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M18 26 Q22 30 26 26" stroke="#78350F" stroke-width="2" fill="none"/>
    <!-- Arm Pointing to Station -->
    <line x1="5" y1="52" x2="-28" y2="35" stroke="#FDE68A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-30" cy="34" r="5" fill="#FDE68A"/>
    <!-- Legs -->
    <rect x="6" y="102" width="11" height="35" rx="5" fill="#334155"/>
    <rect x="23" y="102" width="11" height="35" rx="5" fill="#334155"/>
  </g>

  <!-- Speech Bubble Passerby -->
  <g transform="translate(370, 20)">
    <rect width="180" height="52" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
    <polygon points="50,52 60,64 70,52" fill="#FFFFFF"/>
    <polygon points="48,52 60,66 72,52" fill="none" stroke="#059669" stroke-width="2.5"/>
    <rect x="49" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="90" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#065F46" text-anchor="middle">あそこです！(Lurus ke sana!)</text>
    <text x="90" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#059669" text-anchor="middle">Asoko desu! Masugu itte ne.</text>
  </g>
</svg>
