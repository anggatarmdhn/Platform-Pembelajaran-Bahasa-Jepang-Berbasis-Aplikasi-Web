<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="stationBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadowStation" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Panel Frame -->
  <rect x="8" y="8" width="584" height="304" rx="16" fill="url(#stationBg)" stroke="#2563EB" stroke-width="3"/>

  <!-- Comic Badge -->
  <rect x="24" y="20" width="170" height="28" rx="8" fill="#2563EB"/>
  <text x="34" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="0.5">KOMIK SITUASI #4</text>
  <text x="206" y="39" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="13" fill="#1E3A8A">Stasiun Kereta Yamanote: Membaca Papan Nama Kanji &amp; Hiragana</text>

  <!-- JR Train Station Signboard (Large Center) -->
  <g transform="translate(140, 56)" filter="url(#shadowStation)">
    <!-- White Sign with Green JR Border -->
    <rect x="0" y="0" width="320" height="96" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
    <rect x="4" y="4" width="312" height="12" fill="#10B981"/>
    <!-- Furigana Hiragana on Top -->
    <text x="160" y="34" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="12" fill="#047857" text-anchor="middle">とうきょう</text>
    <!-- Big Kanji in Middle -->
    <text x="160" y="68" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="32" fill="#0F172A" text-anchor="middle" letter-spacing="8">東 京</text>
    <!-- Romaji on Bottom -->
    <text x="160" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="2">TŌKYŌ</text>
    <!-- Direction Arrows -->
    <path d="M30 65 L20 70 L30 75 Z" fill="#10B981"/>
    <text x="38" y="73" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#64748B">有楽町</text>
    <path d="M290 65 L300 70 L290 75 Z" fill="#10B981"/>
    <text x="254" y="73" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#64748B">神田</text>
  </g>

  <!-- Train Platform Pillar & Hanging Wire -->
  <line x1="200" y1="8" x2="200" y2="56" stroke="#475569" stroke-width="2.5"/>
  <line x1="400" y1="8" x2="400" y2="56" stroke="#475569" stroke-width="2.5"/>

  <!-- Kenji (Left) Pointing at Sign -->
  <g transform="translate(100, 150)">
    <path d="M50 90 C50 65 75 55 95 55 C115 55 140 65 140 90 Z" fill="#2563EB" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="95" cy="32" rx="19" ry="22" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <path d="M76 28 C74 12 85 4 95 4 C106 4 116 12 114 28 Z" fill="#1E293B"/>
    <ellipse cx="88" cy="30" rx="3" ry="4" fill="#1E293B"/>
    <ellipse cx="102" cy="30" rx="3" ry="4" fill="#1E293B"/>
    <path d="M90 38 Q95 44 100 38 Z" fill="#D9383A"/>
    <!-- Arm Pointing Up -->
    <path d="M70 65 L50 35 L55 30 L80 55 Z" fill="#2563EB" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="50" cy="32" r="5" fill="#FDE68A"/>
  </g>

  <!-- Aoi (Right) Holding Station Map -->
  <g transform="translate(360, 150)">
    <path d="M30 60 C30 85 40 96 60 96 C80 96 90 85 90 60 Z" fill="#78350F"/>
    <path d="M38 84 L60 102 L82 84 L92 114 L28 114 Z" fill="#3B82F6"/>
    <ellipse cx="60" cy="40" rx="18" ry="20" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
    <path d="M42 35 C42 16 52 10 60 10 C68 10 78 16 78 35 Z" fill="#92400E"/>
    <circle cx="74" cy="24" r="3.5" fill="#F472B6"/>
    <!-- Map in Hands -->
    <rect x="25" y="70" width="40" height="25" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="30" y1="78" x2="60" y2="78" stroke="#10B981" stroke-width="2"/>
    <line x1="30" y1="84" x2="60" y2="84" stroke="#D9383A" stroke-width="2"/>
  </g>

  <!-- Speech Bubble -->
  <g transform="translate(190, 175)" filter="url(#shadowStation)">
    <path d="M10 0 L230 0 C240 0 245 5 245 15 L245 55 C245 65 240 70 230 70 L120 70 L100 85 L108 70 L10 70 C0 70 -5 65 -5 55 L-5 15 C-5 5 0 0 10 0 Z" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="14" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#1E293B">Aoi: "Lihat, di atas Kanji『東京』,</text>
    <text x="14" y="46" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="13" fill="#047857">ada Hiragana『とうきょう』</text>
    <text x="14" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">sebagai petunjuk cara bacanya (Furigana)!"</text>
  </g>

  <!-- Platform Ground -->
  <rect x="24" y="270" width="552" height="24" rx="4" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>
  <rect x="30" y="272" width="540" height="6" fill="#FCD34D"/>
</svg>
