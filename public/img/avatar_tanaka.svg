  <path d="M64 45 Q69 42 74 45" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Warm Smiling) -->
  <circle cx="51" cy="53" r="3.5" fill="#1E293B"/>
  <circle cx="69" cy="53" r="3.5" fill="#1E293B"/>
  <circle cx="52" cy="52" r="1.2" fill="#FFFFFF"/>
  <circle cx="70" cy="52" r="1.2" fill="#FFFFFF"/>

  <!-- Teacher Glasses (Red & Modern) -->
  <rect x="43" y="47" width="16" height="12" rx="3.5" fill="none" stroke="#D9383A" stroke-width="2.2"/>
