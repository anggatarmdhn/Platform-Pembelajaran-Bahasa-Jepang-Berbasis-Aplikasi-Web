  <circle cx="60" cy="60" r="50" fill="none" stroke="#FECACA" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <!-- Shoulders & Suit -->
  <path d="M22 114 C24 92 40 82 60 82 C80 82 96 92 98 114 Z" fill="url(#suitGrad)"/>
