  <path d="M60 58 L60 62" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M54 67 Q60 72 66 67" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>

