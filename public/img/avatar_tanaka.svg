  <line x1="59" y1="52" x2="61" y2="52" stroke="#D9383A" stroke-width="2.2"/>
  <line x1="39" y1="50" x2="43" y2="52" stroke="#D9383A" stroke-width="2"/>
  <line x1="77" y1="52" x2="81" y2="50" stroke="#D9383A" stroke-width="2"/>

