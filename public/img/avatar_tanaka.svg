  <!-- Head & Face -->
  <ellipse cx="60" cy="54" rx="23" ry="26" fill="#FDE68A"/>
  
  <!-- Hair (Neat Sensei Style) -->
  <path d="M35 52 C35 30 45 22 60 22 C75 22 85 30 85 52 C82 46 76 44 68 46 C60 40 50 42 45 48 C40 48 37 50 35 52 Z" fill="#334155"/>
