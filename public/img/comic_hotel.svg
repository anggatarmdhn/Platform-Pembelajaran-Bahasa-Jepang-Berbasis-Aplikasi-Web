<svg viewBox="0 0 600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hotel Lobby Background -->
  <rect width="600" height="320" fill="#F8FAFC"/>
  <!-- Elegant Wooden Wall Panels -->
  <rect x="0" y="0" width="600" height="230" fill="#F1F5F9"/>
  <line x1="120" y1="0" x2="120" y2="230" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="240" y1="0" x2="240" y2="230" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="360" y1="0" x2="360" y2="230" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="480" y1="0" x2="480" y2="230" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Reception Sign -->
  <rect x="230" y="30" width="140" height="36" rx="6" fill="#1E293B"/>
  <text x="300" y="53" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#F8FAFC" text-anchor="middle">HOTEL FRONT</text>

  <!-- Marble Floor -->
  <rect y="230" width="600" height="90" fill="#E2E8F0"/>
  <!-- Front Desk Counter -->
  <rect x="230" y="150" width="230" height="95" rx="10" fill="#334155" stroke="#1E293B" stroke-width="3"/>
  <rect x="240" y="135" width="210" height="20" rx="4" fill="#475569"/>
  <!-- Desk Bell & Key -->
  <circle cx="280" cy="142" r="7" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <rect x="360" y="140" width="16" height="6" rx="2" fill="#E2E8F0"/>

  <!-- Kenji with Rolling Suitcase -->
  <g transform="translate(100, 115)">
    <!-- Suitcase -->
    <rect x="-30" y="45" width="24" height="42" rx="4" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    <rect x="-24" y="30" width="12" height="15" fill="none" stroke="#64748B" stroke-width="2.5"/>
    <circle cx="-24" cy="90" r="3" fill="#1E293B"/>
    <circle cx="-12" cy="90" r="3" fill="#1E293B"/>
    <!-- Body -->
    <rect x="0" y="38" width="42" height="65" rx="12" fill="#2563EB"/>
    <circle cx="21" cy="20" r="18" fill="#FDE68A"/>
    <path d="M4 18 Q21 -4 38 18 Q21 8 4 18 Z" fill="#1E293B"/>
    <circle cx="16" cy="20" r="2.5" fill="#1E293B"/>
    <circle cx="27" cy="20" r="2.5" fill="#1E293B"/>
    <path d="M18 26 Q21 29 25 26" stroke="#78350F" stroke-width="2" fill="none"/>
    <rect x="6" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
    <rect x="24" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
  </g>

  <!-- Speech Bubble Kenji -->
  <g transform="translate(15, 20)">
    <rect width="230" height="52" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <polygon points="120,52 130,64 140,52" fill="#FFFFFF"/>
    <polygon points="118,52 130,66 142,52" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="119" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="115" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle">チェックインをお願いします！</text>
    <text x="115" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748B" text-anchor="middle">Chekku-in o onegaishimasu!</text>
  </g>

  <!-- Hotel Staff Behind Desk -->
  <g transform="translate(480, 100)">
    <rect x="0" y="38" width="42" height="65" rx="12" fill="#0F172A"/>
    <!-- Uniform Collar & Bowtie -->
    <polygon points="21,38 14,48 28,48" fill="#FFFFFF"/>
    <polygon points="21,48 18,55 24,55" fill="#DC2626"/>
    <circle cx="21" cy="20" r="18" fill="#FDE68A"/>
    <path d="M3 18 Q21 -4 39 18 Q21 6 3 18 Z" fill="#334155"/>
    <path d="M14 20 Q18 16 22 20" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M24 20 Q28 16 32 20" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M18 28 Q22 32 26 28" stroke="#78350F" stroke-width="2" fill="none"/>
    <rect x="6" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
    <rect x="24" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
  </g>

  <!-- Speech Bubble Staff -->
  <g transform="translate(370, 20)">
    <rect width="215" height="52" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <polygon points="120,52 130,64 140,52" fill="#FFFFFF"/>
    <polygon points="118,52 130,66 142,52" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="119" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="107" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle">いらっしゃいませ！お名前は？</text>
    <text x="107" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#475569" text-anchor="middle">Irasshaimase! O-namae wa? (Nama?)</text>
  </g>
</svg>
