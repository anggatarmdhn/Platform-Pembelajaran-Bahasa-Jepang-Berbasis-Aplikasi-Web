<svg viewBox="0 0 600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Souvenir Shop Background -->
  <rect width="600" height="320" fill="#FFFBEB"/>
  <!-- Traditional Wooden Shelf / Canopy -->
  <rect y="0" width="600" height="50" fill="#991B1B"/>
  <rect y="45" width="600" height="10" fill="#7F1D1D"/>
  <text x="300" y="32" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="20" fill="#FEF08A" text-anchor="middle">おみやげ • OMIYAGE SHOP</text>
  <!-- Floor -->
  <rect y="230" width="600" height="90" fill="#FDE68A"/>
  <!-- Display Counter -->
  <rect x="220" y="160" width="220" height="85" rx="8" fill="#B45309" stroke="#78350F" stroke-width="3"/>
  <rect x="230" y="145" width="200" height="20" rx="4" fill="#D97706"/>

  <!-- Lucky Cat (Maneki Neko) on Counter -->
  <g transform="translate(250, 95)">
    <circle cx="20" cy="30" r="18" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="20" cy="46" rx="22" ry="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <!-- Ears -->
    <polygon points="6,18 14,8 18,20" fill="#DC2626"/>
    <polygon points="22,20 26,8 34,18" fill="#DC2626"/>
    <!-- Eyes -->
    <path d="M12 28 Q16 25 20 28" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M22 28 Q26 25 29 28" stroke="#1E293B" stroke-width="2" fill="none"/>
    <!-- Golden Coin -->
    <circle cx="20" cy="48" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <text x="20" y="52" font-family="'Noto Sans JP', sans-serif" font-size="8" font-weight="900" fill="#78350F" text-anchor="middle">千両</text>
    <!-- Raised Paw -->
    <ellipse cx="36" cy="22" rx="7" ry="11" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" transform="rotate(20 36 22)"/>
  </g>

  <!-- Tokyo Souvenir Box on Counter -->
  <g transform="translate(340, 115)">
    <rect width="65" height="42" rx="5" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
    <rect x="5" y="5" width="55" height="32" rx="3" fill="#FDE047"/>
    <text x="32" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="10" fill="#854D0E" text-anchor="middle">TOKYO</text>
    <text x="32" y="34" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="8" fill="#A16207" text-anchor="middle">お菓子 ¥1,200</text>
  </g>

  <!-- Kenji (Tourist Pointing at Souvenir) -->
  <g transform="translate(100, 115)">
    <rect x="0" y="38" width="42" height="65" rx="12" fill="#2563EB"/>
    <circle cx="21" cy="20" r="18" fill="#FDE68A"/>
    <path d="M4 18 Q21 -4 38 18 Q21 8 4 18 Z" fill="#1E293B"/>
    <circle cx="16" cy="20" r="2.5" fill="#1E293B"/>
    <circle cx="27" cy="20" r="2.5" fill="#1E293B"/>
    <path d="M18 26 Q21 29 25 26" stroke="#78350F" stroke-width="2" fill="none"/>
    <!-- Arm Pointing to Maneki Neko -->
    <line x1="38" y1="55" x2="85" y2="42" stroke="#FDE68A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="87" cy="41" r="5" fill="#FDE68A"/>
    <rect x="6" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
    <rect x="24" y="102" width="12" height="35" rx="5" fill="#1E293B"/>
  </g>

  <!-- Speech Bubble Kenji -->
  <g transform="translate(30, 15)">
    <rect width="230" height="52" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <polygon points="120,52 130,64 140,52" fill="#FFFFFF"/>
    <polygon points="118,52 130,66 142,52" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="119" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="115" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle">これを見せてください！</text>
    <text x="115" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748B" text-anchor="middle">Kore o misete kudasai! (Boleh lihat ini?)</text>
  </g>

  <!-- Shopkeeper Behind Counter -->
  <g transform="translate(470, 105)">
    <rect x="0" y="38" width="42" height="65" rx="12" fill="#DC2626"/>
    <!-- Apron -->
    <rect x="6" y="48" width="30" height="50" rx="4" fill="#FFFBEB"/>
    <circle cx="21" cy="20" r="18" fill="#FDE68A"/>
    <!-- Hair -->
    <circle cx="21" cy="18" r="19" fill="#1E293B"/>
    <circle cx="21" cy="22" r="17" fill="#FDE68A"/>
    <path d="M14 20 Q18 16 22 20" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M24 20 Q28 16 32 20" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M18 28 Q22 32 26 28" stroke="#78350F" stroke-width="2" fill="none"/>
    <rect x="6" y="102" width="12" height="35" rx="5" fill="#475569"/>
    <rect x="24" y="102" width="12" height="35" rx="5" fill="#475569"/>
  </g>

  <!-- Speech Bubble Shopkeeper -->
  <g transform="translate(370, 15)">
    <rect width="210" height="52" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
    <polygon points="120,52 130,64 140,52" fill="#FFFFFF"/>
    <polygon points="118,52 130,66 142,52" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="119" y="50" width="22" height="4" fill="#FFFFFF"/>
    <text x="105" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#991B1B" text-anchor="middle">はい、どうぞ！(Tentu, ini dia!)</text>
    <text x="105" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#DC2626" text-anchor="middle">Hai, douzo! Kore wa ninki desu.</text>
  </g>
</svg>
